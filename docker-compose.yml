services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-8000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-airaware}:${POSTGRES_PASSWORD:-airaware_dev_password}@postgres:5432/${POSTGRES_DB:-airaware}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airaware}
      POSTGRES_USER: ${POSTGRES_USER:-airaware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airaware_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
